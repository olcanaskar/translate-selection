<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Translate Selection</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f8fa;
        --text: #202124;
        --muted: #5f6368;
        --accent: #1a73e8;
        --card: #ffffff;
        --border: rgba(60, 64, 67, 0.14);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17181a;
          --text: #e8eaed;
          --muted: #9aa0a6;
          --accent: #8ab4f8;
          --card: #202124;
          --border: rgba(255, 255, 255, 0.12);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      }
      main {
        width: min(720px, calc(100% - 32px));
        margin: 48px auto;
        padding: 32px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--card);
        box-shadow: 0 10px 30px rgba(32, 33, 36, 0.08);
        text-align: center;
      }
      .logo {
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        margin: 0 auto 18px;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        font-size: 32px;
        font-weight: 700;
      }
      h1 { margin: 0 0 8px; font-size: 26px; }
      p { color: var(--muted); line-height: 1.6; }
      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 24px;
      }
      a {
        padding: 9px 14px;
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--accent);
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover { border-color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">T</div>
      <h1>Translate Selection</h1>
      <p>
        Translate selected text in a small in-page card. See other meanings and
        switch target languages instantly.
      </p>
      <nav>
        <a href="https://github.com/olcanaskar/translate-selection">GitHub</a>
        <a href="./privacy.html">Privacy Policy</a>
      </nav>
    </main>
  </body>
</html>
